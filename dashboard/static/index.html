<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LLM Network Benchmark</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>LLM Network Benchmark</h1>
    <p class="subtitle">Model pass rates by vendor, OS train, and task category</p>
  </header>

  <main>
    <div class="controls">
      <label for="date-filter">Date</label>
      <select id="date-filter">
        <option value="">All dates</option>
      </select>

      <label for="run-filter">Run</label>
      <select id="run-filter" disabled>
        <option value="">Select a date first</option>
      </select>
    </div>

    <table id="leaderboard">
      <thead>
        <tr>
          <th>Model</th>
          <th>Vendor / OS Train</th>
          <th>Category</th>
          <th>Pass Rate</th>
          <th>Runs</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body">
        <tr><td colspan="5">Loading…</td></tr>
      </tbody>
    </table>

    <section id="run-detail" class="run-detail hidden">
      <h2 id="run-detail-title"></h2>
      <table>
        <thead>
          <tr>
            <th>Model</th>
            <th>Status</th>
            <th>Cost</th>
            <th>Latency</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody id="run-detail-body"></tbody>
      </table>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
