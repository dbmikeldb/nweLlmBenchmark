id: cisco-iosxe-dhcp-client-wan
vendor: cisco
os_train: iosxe
tier: bootcheck
scoring: binary
title: WAN interface, DHCP client, admin up

llm_input:
  prompt: |
    Provide the Cisco IOS-XE CLI configuration to bring GigabitEthernet0/1
    administratively up, with a description of [WAN]-[CCT12345]-[100/1000]
    and configure it as a DHCP client to obtain its IP address dynamically.

    Do not provide the DHCP server configuration, only the interface configuration.

    Enter configuration mode, define the configuration, exit to privileged EXEC,
    and save the configuration to memory.

    TLDR output, commands only, no Markdown or code fences.
  context:
    interface: GigabitEthernet0/1
    description: "[WAN]-[CCT12345]-[100/1000]"

grading:
  expected_config: |
    configure terminal
    !
    interface GigabitEthernet0/1
     description [WAN]-[CCT12345]-[100/1000]
     ip address dhcp
     no shutdown
    !
    exit
    end
    write memory
  pass_criteria:
    required_lines:
      - "ip address dhcp"
      - "no shutdown"
    required_substrings:
      - "[WAN]-[CCT12345]-[100/1000]"
    config_saved: true
    isolation:
      interface: GigabitEthernet0/1
