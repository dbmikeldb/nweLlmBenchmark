id: cisco-iosxe-static-route-permanent
vendor: cisco
os_train: iosxe
tier: bootcheck
category: static-routing
scoring: binary
title: Permanent static route via next-hop IP

llm_input:
  prompt: |
    Provide the Cisco IOS-XE CLI configuration to add a static route to
    network 192.0.2.0/24 via next-hop IP address 198.51.100.1, specifying
    only the IP address as the next hop.

    This route must remain in the routing table even if the next hop
    becomes unreachable.

    Enter configuration mode, define the configuration, exit to
    privileged EXEC, and save the configuration to memory.

    TLDR output, full syntax commands only, no Markdown or code fences.
  context:
    network: 192.0.2.0/24
    next_hop: 198.51.100.1

grading:
  expected_config: |
    configure terminal
    !
    ip route 192.0.2.0 255.255.255.0 198.51.100.1 permanent
    !
    exit
    end
    write memory
  pass_criteria:
    required_lines:
      - "ip route 192.0.2.0 255.255.255.0 198.51.100.1 permanent"
    config_saved: true
    isolation:
      allowed_top_level_prefixes:
        - "ip route 192.0.2.0 255.255.255.0"
