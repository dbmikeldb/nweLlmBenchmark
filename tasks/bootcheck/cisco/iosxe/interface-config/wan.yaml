scoring: binary
title: WAN interface, admin up, best-practice hardening
tags: [wan]

llm_input:
  prompt: |
    Provide the Cisco IOS-XE CLI configuration to bring GigabitEthernet0/1
    administratively up, with a description of [WAN]-[CCT12345]-[100/1000]
    and an IP address of 192.168.0.1 on network 255.255.255.0.

    Ensure Cisco best practices are configured for interface hardening.

    Enter configuration mode, apply the change, exit to privileged EXEC,
    and save the configuration to memory.

    TLDR output, full syntax commands only, no Markdown or code fences.
  context:
    interface: GigabitEthernet0/1
    ip_address: 192.168.0.1
    prefix_length: 24
    description: "[WAN]-[CCT12345]-[100/1000]"

grading:
  expected_config: |
    configure terminal
    !
    interface GigabitEthernet0/1
     description [WAN]-[CCT12345]-[100/1000]
     ip address 192.168.0.1 255.255.255.0
     no ip redirects
     no ip unreachables
     no ip proxy-arp
     no shutdown
    !
    exit
    end
    write memory
  pass_criteria:
    required_lines:
      - "no shutdown"
      - "ip address 192.168.0.1 255.255.255.0"
      - "no ip redirects"
      - "no ip unreachables"
      - "no ip proxy-arp"
    required_substrings:
      - "[WAN]-[CCT12345]-[100/1000]"
    config_saved: true
    isolation:
      interface: GigabitEthernet0/1
